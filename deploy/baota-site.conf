# 宝塔 → 网站 → www.zhonghcc.com → 设置 → 伪静态，粘贴以下内容后保存
# 放在伪静态里而不是直接改配置文件，是因为宝塔改站点设置（如续签证书）时会重写配置文件，伪静态内容不受影响

# 统一到裸域：www 一律 301 到 https://zhonghcc.com，证书验证路径除外
set $to_apex 0;
if ($host = www.zhonghcc.com) {
    set $to_apex 1;
}
if ($uri ~ ^/\.well-known/) {
    set $to_apex 0;
}
if ($to_apex = 1) {
    return 301 https://zhonghcc.com$request_uri;
}

# /api/ 转给本机 Docker 里的代理；^~ 保证不被宝塔默认的 js/css/图片正则规则抢先匹配
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# 入口页不缓存，发布后立即生效；js/css 文件名带哈希，沿用宝塔默认的缓存规则即可
location = /index.html {
    add_header Cache-Control "no-cache";
}
