# 服务器上只运行壁纸与诗词代理；静态文件由宝塔 Nginx 直接托管
services:
  proxy:
    build: ./proxy
    container_name: homepage-proxy
    restart: unless-stopped
    # 只绑本机回环地址，由宝塔 Nginx 反代 /api/；不要写成 "3000:3000"，否则会绕过防火墙直接暴露到公网
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - WALLPAPER_RESOLUTION=1920x1080
    # 用命名卷保存缓存，容器重建后壁纸和诗词缓存仍在
    # 不用宿主机目录，是因为容器以 node 用户运行，宿主机目录默认属 root，会写不进去
    volumes:
      - proxy-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxy-cache:
